<style>

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121413; --surface: #181b19; --surface-2: #1f2321; --ink: #ecebe5; --ink-2: #d8d6ce;
      --muted: #a19e95; --rule: #2a2e2b; --rule-strong: #3a3f3b; --accent: #5ec2a7; --accent-soft: #163730; --accent-ink: #0b1f1a;

    --muted: #a19e95; --rule: #2a2e2b; --rule-strong: #3a3f3b; --accent: #5ec2a7; --accent-soft: #163730; --accent-ink: #0b1f1a;
    --long: #5cc98c; --short: #f47b6e; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { max-width: 1220px; margin: 0 auto; padding: 20px 16px 40px; }
  .page > p { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .page a { color: var(--accent); }
</style>
