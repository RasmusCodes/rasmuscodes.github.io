<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volatility Desk</title>
<meta name="description" content="Interactive implied-volatility surfaces, option strategies, scenarios and backtests, computed in the browser from fitted model parameters.">
<style>
  /* Design tokens of the host site (copied here for the standalone dev page). */
  :root {
    color-scheme: light;
    --bg: #fbfaf6; --surface: #ffffff; --surface-2: #f3f1ea; --ink: #1a1a18; --ink-2: #2f2e2a; --muted: #6b6963; --faint: #8f8c84;
    --rule: #e6e2d8; --rule-strong: #d3cec1; --accent: #14594b; --accent-hover: #0d4237; --accent-soft: #e3efea;
    --long: #157347; --short: #b42318; --watch: #8a5a00; --neutral: #475467;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121413; --surface: #181b19; --surface-2: #1f2321; --ink: #ecebe5; --ink-2: #d8d6ce; --muted: #a19e95; --faint: #7c7970;
      --rule: #2a2e2b; --rule-strong: #3a3f3b; --accent: #5ec2a7; --accent-hover: #82d4be; --accent-soft: #163730;
      --long: #5cc98c; --short: #f47b6e; --watch: #e7b54d; --neutral: #a9b2c1;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121413; --surface: #181b19; --surface-2: #1f2321; --ink: #ecebe5; --ink-2: #d8d6ce; --muted: #a19e95; --faint: #7c7970;
    --rule: #2a2e2b; --rule-strong: #3a3f3b; --accent: #5ec2a7; --accent-hover: #82d4be; --accent-soft: #163730;
    --long: #5cc98c; --short: #f47b6e; --watch: #e7b54d; --neutral: #a9b2c1;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 var(--serif); overflow-x: hidden; }
  /* imitates the website's 700px article column, so the app's full-width breakout is exercised */
  .article { max-width: 700px; margin: 0 auto; padding: 40px 16px 64px; }
  .article h1 { font-weight: 500; font-size: 34px; line-height: 1.2; margin: 0 0 12px; }
  .article p { margin: 0 0 1em; color: var(--ink-2); }
  .devbar { font: 13px var(--sans); color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .devbar select { font: inherit; }
</style>
<link rel="stylesheet" href="app/voldesk.css">
</head>
<body>
<main class="article">
  <div class="devbar"><label for="theme">Theme (dev page only)</label>
    <select id="theme"><option value="">auto</option><option value="light">light</option><option value="dark">dark</option></select></div>
  <h1>Cross-asset volatility desk</h1>
  <p>Implied-volatility surfaces, option strategies, scenarios and backtests, rebuilt in the browser from the fitted model parameters of the research repository.</p>
  <div id="voldesk-app"></div>
</main>
<script>
  document.getElementById('theme').addEventListener('change', function (e) {
    if (e.target.value) document.documentElement.setAttribute('data-theme', e.target.value);
    else document.documentElement.removeAttribute('data-theme');
  });
</script>
<script type="module" src="app/voldesk.js"></script>
</body>
</html>
