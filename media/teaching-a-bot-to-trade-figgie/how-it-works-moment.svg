<text x="393.7" y="350.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" >4%</text>
<text x="360.0" y="395.0" font-size="20" fill="#e34948" text-anchor="middle" font-weight="400" >♥</text>
<path d="M382.0,378.0 L404.9,378.0 Q407.9,378.0 407.9,381.0 L407.9,385.0 Q407.9,388.0 404.9,388.0 L382.0,388.0 Z" stroke="none" stroke-width="0" fill="#c3c2b7" stroke-linejoin="round" stroke-linecap="round" />
<text x="413.9" y="387.5" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >18%</text>
