<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>How the bot works, at one real moment</title>
<rect width="1200" height="900" fill="#fcfcfb"/>
<text x="48.0" y="58.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600" >How the bot works, at one real moment</text>
<text x="48.0" y="90.0" font-size="17" fill="#52514e" text-anchor="start" font-weight="400" >Live round 4 of v13, 3:17 in: what it saw, what it concluded, and what it did in the next three seconds</text>
<text x="48.0" y="878.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >Replayed from the round's logged quotes and trades (the goal was diamonds; the bot made +$152). The parts marked Bayes are Bayesian.</text>
