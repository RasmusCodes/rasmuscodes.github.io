<text x="66.0" y="146.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600" >What it sees</text>
<text x="48.0" y="168.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >public information only</text>
