<text x="66.0" y="216.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >Its hand</text>
<text x="66.0" y="254.0" font-size="28" fill="#e34948" text-anchor="start" font-weight="400" >♥</text>
<text x="94.0" y="254.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600" >3</text>
<text x="152.0" y="254.0" font-size="28" fill="#e34948" text-anchor="start" font-weight="400" >♦</text>
<text x="180.0" y="254.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600" >7</text>
<text x="66.0" y="278.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >(no spades or clubs left)</text>
<text x="66.0" y="318.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >Highest bid by anyone</text>
<text x="66.0" y="344.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="400" >♠</text>
<text x="85.0" y="344.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" >$6</text>
<text x="166.0" y="344.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="400" >♣</text>
<text x="185.0" y="344.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" >$11</text>
<text x="66.0" y="369.0" font-size="17" fill="#e34948" text-anchor="start" font-weight="400" >♥</text>
<text x="85.0" y="369.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" >$8</text>
<text x="166.0" y="369.0" font-size="17" fill="#e34948" text-anchor="start" font-weight="400" >♦</text>
<text x="185.0" y="369.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" >$9</text>
<text x="66.0" y="408.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >Consensus: the lowest of</text>
<text x="66.0" y="425.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >the three bots' top bids</text>
<text x="66.0" y="451.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="400" >♠</text>
<text x="85.0" y="451.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" >$4</text>
<text x="166.0" y="451.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="400" >♣</text>
<text x="185.0" y="451.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" >$6</text>
<text x="66.0" y="476.0" font-size="17" fill="#e34948" text-anchor="start" font-weight="400" >♥</text>
<text x="85.0" y="476.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" >$4</text>
<text x="166.0" y="476.0" font-size="17" fill="#e34948" text-anchor="start" font-weight="400" >♦</text>
<text x="185.0" y="476.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" >$8</text>
<text x="66.0" y="530.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >plus every trade on the</text>
<text x="66.0" y="548.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >tape, and the clock</text>
<text x="352.0" y="216.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >P(deck | seen) ∝</text>
<text x="352.0" y="234.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >P(hand | deck) × P(market | deck)</text>
<text x="352.0" y="262.0" font-size="12.5" fill="#898781" text-anchor="start" font-weight="400" >chance each suit is the goal</text>
<text x="360.0" y="295.0" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="400" >♠</text>
<path d="M382.0,278.0 L397.9,278.0 Q400.9,278.0 400.9,281.0 L400.9,285.0 Q400.9,288.0 397.9,288.0 L382.0,288.0 Z" stroke="none" stroke-width="0" fill="#c3c2b7" stroke-linejoin="round" stroke-linecap="round" />
<text x="406.9" y="287.5" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >14%</text>
<path d="M382.0,291.0 L382.8,291.0 Q383.5,291.0 383.5,291.8 L383.5,300.2 Q383.5,301.0 382.8,301.0 L382.0,301.0 Z" stroke="none" stroke-width="0" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round" />
<text x="389.5" y="300.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" >&lt;1%</text>
<text x="360.0" y="345.0" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="400" >♣</text>
<path d="M382.0,328.0 L404.9,328.0 Q407.9,328.0 407.9,331.0 L407.9,335.0 Q407.9,338.0 404.9,338.0 L382.0,338.0 Z" stroke="none" stroke-width="0" fill="#c3c2b7" stroke-linejoin="round" stroke-linecap="round" />
<text x="413.9" y="337.5" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >18%</text>
