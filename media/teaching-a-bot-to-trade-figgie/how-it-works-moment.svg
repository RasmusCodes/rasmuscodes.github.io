<text x="638.0" y="146.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600" >What a card is worth</text>
<text x="620.0" y="168.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >$10 × P(goal) + bonus share</text>
<rect x="620" y="184" width="246" height="408" rx="10" fill="#fcfcfb" fill-opacity="1" stroke="#c3c2b7"/>
