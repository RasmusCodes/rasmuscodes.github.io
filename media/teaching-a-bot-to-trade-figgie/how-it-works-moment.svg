<text x="520.6" y="450.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" >95%</text>
<path d="M352.0,473.0 L363.0,473.0 Q366.0,473.0 366.0,476.0 L366.0,480.0 Q366.0,483.0 363.0,483.0 L352.0,483.0 Z" stroke="none" stroke-width="0" fill="#c3c2b7" stroke-linejoin="round" stroke-linecap="round" />
<text x="372.0" y="482.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >its hand alone</text>
<path d="M352.0,493.0 L363.0,493.0 Q366.0,493.0 366.0,496.0 L366.0,500.0 Q366.0,503.0 363.0,503.0 L352.0,503.0 Z" stroke="none" stroke-width="0" fill="#2a78d6" stroke-linejoin="round" stroke-linecap="round" />
<text x="372.0" y="502.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >after the market too</text>
<text x="352.0" y="532.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Every bot bid ♦ to $8+: that</text>
<text x="352.0" y="550.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >alone multiplies ♦'s odds by 11</text>
<text x="766.0" y="216.0" font-size="12" fill="#898781" text-anchor="end" font-weight="400" >buy one</text>
<text x="843.0" y="216.0" font-size="12" fill="#898781" text-anchor="end" font-weight="400" >sell one</text>
<text x="638.0" y="250.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="400" >♠</text>
<text x="766.0" y="250.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">$0.00</text>
<text x="843.0" y="250.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">–</text>
<text x="638.0" y="282.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="400" >♣</text>
<text x="766.0" y="282.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">$0.40</text>
<text x="843.0" y="282.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">–</text>
<text x="638.0" y="314.0" font-size="18" fill="#e34948" text-anchor="start" font-weight="400" >♥</text>
<text x="766.0" y="314.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">$0.50</text>
<text x="843.0" y="314.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">$0.10</text>
<text x="638.0" y="346.0" font-size="18" fill="#e34948" text-anchor="start" font-weight="400" >♦</text>
<text x="766.0" y="346.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">$9.50</text>
<text x="843.0" y="346.0" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">$9.50</text>
<text x="638.0" y="402.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >= $10 × P(goal)</text>
<text x="638.0" y="420.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >+ the change in its bonus share</text>
<text x="638.0" y="474.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >With 7 diamonds the bonus is</text>
<text x="638.0" y="492.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >safe either way, so a spare ♦</text>
<text x="638.0" y="510.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >is worth just its payout:</text>
<text x="638.0" y="528.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >$10 × 95% ≈ $9.50</text>
<text x="924.0" y="216.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" style="font-variant-numeric: tabular-nums">3:19</text>
<text x="924.0" y="237.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" >Sells a ♥ into a $4 bid</text>
<text x="924.0" y="256.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >worth $0.10 to it</text>
<text x="924.0" y="298.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" style="font-variant-numeric: tabular-nums">3:19</text>
<text x="924.0" y="319.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" >Buys a ♠ offered at $2</text>
<text x="924.0" y="338.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >to resell: it rates a $1 card</text>
<text x="924.0" y="356.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >80% likely to be bid back up</text>
<text x="924.0" y="398.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" style="font-variant-numeric: tabular-nums">3:20</text>
<text x="924.0" y="419.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" >Sells a spare ♦ for $16</text>
<text x="924.0" y="438.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >worth $9.50 to it: a $6.50 gain</text>
<text x="924.0" y="532.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >It takes a quote only when the</text>
<text x="924.0" y="550.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >gain beats $1 + 20% of value</text>
<rect x="48" y="640" width="532" height="156" rx="10" fill="#cde2fb" fill-opacity="0.5" stroke="#c3c2b7"/>
<rect x="514" y="652" width="54" height="20" rx="10" fill="#2a78d6"/>
<text x="541.0" y="666.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >Bayes</text>
<text x="66.0" y="672.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" >Reading learner</text>
<text x="66.0" y="692.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >Bayes' rule at every bell, from the revealed goal</text>
<text x="66.0" y="724.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400" >After 3 rounds at this table it trusts the consensus 99%</text>
<text x="66.0" y="744.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400" >and the colour reading 83%. Each trust level scales how much</text>
<text x="66.0" y="764.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400" >that signal counts in step 2.</text>
<line x1="457.0" y1="636.0" x2="457.0" y2="600.0" stroke="#898781" stroke-width="1.5" />
<path d="M457.0,600.0 L460.9,609.2 L453.1,609.2 Z" stroke="none" stroke-width="0" fill="#898781" stroke-linejoin="round" stroke-linecap="round" />
<rect x="620" y="640" width="532" height="156" rx="10" fill="#cde2fb" fill-opacity="0.5" stroke="#c3c2b7"/>
<rect x="1086" y="652" width="54" height="20" rx="10" fill="#2a78d6"/>
<text x="1113.0" y="666.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >Bayes</text>
<text x="638.0" y="672.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" >Resale learner</text>
<text x="638.0" y="692.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >online Bayesian logistic regression</text>
<text x="638.0" y="724.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400" >Every cheap offer is a yes/no example: did someone bid the suit</text>
<text x="638.0" y="744.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400" >$2 higher within 45 seconds? Its weights carry over from round</text>
<text x="638.0" y="764.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400" >to round, and it buys only when a cautious estimate pays (step 4).</text>
<line x1="1029.0" y1="636.0" x2="1029.0" y2="600.0" stroke="#898781" stroke-width="1.5" />
<path d="M1029.0,600.0 L1032.9,609.2 L1025.1,609.2 Z" stroke="none" stroke-width="0" fill="#898781" stroke-linejoin="round" stroke-linecap="round" />
