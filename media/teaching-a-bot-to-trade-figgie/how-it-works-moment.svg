<text x="924.0" y="146.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600" >What it does</text>
<text x="906.0" y="168.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >the next three seconds, live</text>
