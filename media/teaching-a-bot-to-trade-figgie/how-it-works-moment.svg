<path d="M382.0,428.0 L448.2,428.0 Q451.2,428.0 451.2,431.0 L451.2,435.0 Q451.2,438.0 448.2,438.0 L382.0,438.0 Z" stroke="none" stroke-width="0" fill="#c3c2b7" stroke-linejoin="round" stroke-linecap="round" />
<text x="457.2" y="437.5" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >49%</text>
