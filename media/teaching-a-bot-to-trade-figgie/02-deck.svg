<text x="48.0" y="58.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600" >One hidden suit pays</text>
<text x="48.0" y="90.0" font-size="17" fill="#52514e" text-anchor="start" font-weight="400" >Figgie's 40 cards: one suit has 12, two have 10 and one has 8, and nobody is told which. An example deal:</text>
<text x="48.0" y="653.0" font-size="13" fill="#898781" text-anchor="start" font-weight="400" >With an 8-card goal suit the majority bonus is $120 instead of $100. Ties split it.</text>
