<line x1="48.0" y1="432.0" x2="1152.0" y2="432.0" stroke="#e1e0d9" stroke-width="1" />
<text x="48.0" y="470.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" >A round</text>
<text x="150.0" y="470.0" font-size="16" fill="#898781" text-anchor="start" font-weight="400" >1</text>
<text x="172.0" y="470.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400" >Four players each put $50 in the pot and are dealt 10 cards.</text>
<text x="150.0" y="502.0" font-size="16" fill="#898781" text-anchor="start" font-weight="400" >2</text>
<text x="172.0" y="502.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400" >For four minutes anyone can bid, offer, buy or sell any suit, in the open.</text>
<text x="150.0" y="534.0" font-size="16" fill="#898781" text-anchor="start" font-weight="400" >3</text>
<text x="172.0" y="534.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400" >At the bell each goal card pays $10 from the pot, and whoever holds</text>
<text x="172.0" y="558.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400" >the most goal cards takes the rest: here $100 of the $200.</text>
